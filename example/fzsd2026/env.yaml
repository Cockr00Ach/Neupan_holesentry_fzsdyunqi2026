world:
  height: 20
  width: 25
  step_time: 0.1
  sample_time: 0.1
  offset: [-2, -2]
  collision_mode: 'stop'  # 'stop', 'unobstructed', 'reactive'
  control_mode: 'auto'  # 'keyboard', 'auto'

robot:
  - kinematics: {name: 'omni'}
    shape: {name: 'rectangle', length: 0.6, width: 0.5}
    state: [0, 5, 0]
    goal: [15, 5, 0]
    vel_min: [-3.0, -6.28]
    vel_max: [3.0, 6.28]
    goal_threshold: 0.2
    plot:
      show_trail: True
      show_goal: False
      show_trajectory: False

    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 6.28
        number: 200
        noise: False

obstacle:
  - number: 10
    distribution: {name: 'manual'}
    shape:
      - {name: 'circle', radius: 0.3}
      - {name: 'circle', radius: 0.3}
      - {name: 'circle', radius: 0.3}
      - {name: 'circle', radius: 0.3}
      - {name: 'circle', radius: 0.3}
      - {name: 'circle', radius: 0.3}
      - {name: 'circle', radius: 0.3}
      - {name: 'circle', radius: 0.3}
      - {name: 'rectangle', length: 3.0, width: 0.3}
      - {name: 'rectangle', length: 3.0, width: 0.3}

    state:
      - [2.5, 3.5, 0]
      - [5.0, 6.5, 0]
      - [7.5, 3.5, 0]
      - [10.0, 6.5, 0]
      - [3.0, 7.0, 0]
      - [8.0, 4.5, 0]
      - [12.5, 6.0, 0]
      - [13.0, 3.0, 0]
      - [6.0, 8.5, 0.3]
      - [11.0, 8.5, -0.3]
