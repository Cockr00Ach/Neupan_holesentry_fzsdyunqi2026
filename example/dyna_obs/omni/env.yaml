world:
  height: 42
  width: 42
  step_time: 0.1
  sample_time: 0.1
  offset: [5, 5]
  collision_mode: 'unobstructed'  # 'stop', 'unobstructed', 'reactive'
  control_mode: 'auto'  # 'keyboard', 'auto'


robot:
  - kinematics: {name: 'omni'}
    shape: {name: 'rectangle', length: 0.6, width: 0.5}
    state: [10, 40, 1.57]
    goal: [40, 40, 0]
    vel_min: [-3.0, -6.28]
    vel_max: [3.0, 6.28]
    goal_threshold: 0.4
    plot:
      show_goal: False
      show_trail: True

    sensors: 
      - type: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 6.28
        number: 100
        noise: False
      
      
obstacle:
  - number: 8
    distribution: {name: 'random', range_low: [10, 10, -3.14], range_high: [40, 40, 3.14]}
    kinematics: {name: 'diff'}
    shape:
      - {name: 'circle', radius: 0.4}
      - {name: 'circle', radius: 0.6}
      - {name: 'circle', radius: 0.6}
      - {name: 'circle', radius: 0.3}

    behavior:
      - {name: 'rvo', range_low: [10, 10, -3.14], range_high: [40, 40, 3.14], wander: True, vxmax: 0.3, vymax: 0.3}

    vel_min: [-0.8, -3.14]
    vel_max: [0.8, 3.14]
    arrive_mode: position
    goal_threshold: 0.3
    plot:
      show_goal: False
      show_arrow: True

  
    
