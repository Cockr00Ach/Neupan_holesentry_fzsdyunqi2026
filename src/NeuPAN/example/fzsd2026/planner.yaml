# NeuPAN configuration for the fzsd2026 sentry robot (3D box model).
#
# The robot is modelled as a 3D box: 0.6 x 0.5 x 0.5 m.  With `height` set the
# informed DUNE model works on 3D points and the collision constraints are a
# box (6 half-spaces in x/y/z) instead of a 2D polygon.
#
# z_robot is the height of the box centre above the ground plane, i.e. the frame
# in which the obstacle points are given (z = 0 at the floor).  replica: the bridge
# converts the lidar points into that ground-referenced frame.

# mpc
receding: 10
step_time: 0.1
ref_speed: 1.5
device: 'cpu'
time_print: False
collision_threshold: 0.03

# robot
robot:
  kinematics: 'omni'        # the sentry chassis is a 4-wheel mecanum/omni platform
  max_speed: [3.0, 6.28]
  max_acce: [2.0, 4.0]
  length: 0.6
  width: 0.5
  height: 0.5
  z_robot: 0.25             # box centre height above ground = height / 2
  name: 'fzsd2026_sentry'

# initial path (reference path used when the node starts without a goal)
ipath:
  waypoints: [[-5.0, 3.0, 0.0], [0.0, 3.0, 0.0], [5.0, 0.0, 0.0]]
  curve_style: 'line'
  loop: False
  arrive_threshold: 0.15
  close_threshold: 0.1
  ind_range: 10
  arrive_index_threshold: 1

# proximal alternating minimization network
pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  iter_threshold: 0.1
  # relative to this file (see neupan.init_from_yaml); 3D checkpoint with a 6x3 box model
  dune_checkpoint: 'model/fzsd2026_sentry_3d/model_2000.pth'

# adjust parameters
adjust:
  q_s: 1.0
  p_u: 1.0
  eta: 15.0
  d_max: 0.4
  d_min: 0.04
  ro_obs: 250
  bk: 0.5
