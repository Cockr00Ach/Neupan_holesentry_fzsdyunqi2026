robot:
  kinematics: 'omni'
  length: 0.6
  width: 0.5
  height: 0.5
  name: 'fzsd2026_sentry'

train:
  direct_train: true
  model_name: 'fzsd2026_sentry_3d'
  data_size: 100000
  data_range: [-10, -10, -0.3, 10, 10, 0.8]
  batch_size: 256
  epoch: 5000
  valid_freq: 250
  save_freq: 500
  lr: 5e-5
  lr_decay: 0.5
  decay_freq: 1500
